name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: test
        shell: 'script -q -e -c "stty cols 200 rows 100; bash {0}"'
        run: |
          go test -v -coverprofile=coverage.out ./...
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: coverage threshold
        env:
          # lines(statements)の閾値(%)
          COVERAGE_THRESHOLD: '70.0'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $NF); print $NF}')
          echo "coverage: ${total}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v th="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t >= th) }' || {
            echo "::error::coverage ${total}% is below ${COVERAGE_THRESHOLD}%"
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
